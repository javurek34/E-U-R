<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3efe6">
<meta name="description" content="Vyberte výukovou metodu do své hodiny. Řeknete, jakou část hodiny připravujete, a dostanete hotové zadání pro žáky i postup. Evokace, uvědomění si významu a reflexe.">
<title>Metody do výuky | E–U–R</title>

</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <a href="#" class="brand" aria-label="E–U–R, metody do výuky: úvodní stránka">E–U–R <span>metody do výuky</span></a>
    <a href="#ulozene" class="saved">Uložené <b id="saved-count">0</b></a>
  </div>
</header>

<main id="obsah" tabindex="-1">
  <div id="app" class="wrap"><p class="loading">Načítám metody…</p></div>
  <noscript><p class="wrap notice">Pro výběr metod zapněte JavaScript. Podklady v PDF najdete v patičce stránky.</p></noscript>
</main>

<footer class="foot">
  <div class="wrap foot-row">
    <p id="foot-text">Metody pro přípravu vyučovací hodiny podle modelu E–U–R. Časy, zadání a tipy jsou návrhy pro praxi.</p>
    <p class="foot-links"><span>Podklady v PDF:</span>
      <a href="sources/evokace.pdf" target="_blank" rel="noopener">Evokace</a>
      <a href="sources/uvedomeni.pdf" target="_blank" rel="noopener">Uvědomění</a>
      <a href="sources/reflexe.pdf" target="_blank" rel="noopener">Reflexe</a>
    </p>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<dialog id="stage" class="stage" aria-labelledby="stage-title">
  <div class="stage-top">
    <p id="stage-title" class="stage-title"></p>
    <div class="stage-top-actions">
      <button id="stage-full" type="button" class="stage-button">Celá obrazovka</button>
      <button id="stage-close" type="button" class="stage-button">Zavřít (Esc)</button>
    </div>
  </div>
  <p id="stage-prompt" class="stage-prompt"></p>
  <div class="stage-timer">
    <button id="timer-minus" type="button" class="stage-round" aria-label="Ubrat minutu">−</button>
    <output id="timer-display" class="timer-display" aria-live="off">5:00</output>
    <button id="timer-plus" type="button" class="stage-round" aria-label="Přidat minutu">+</button>
    <button id="timer-toggle" type="button" class="stage-main">Spustit odpočet</button>
    <button id="timer-reset" type="button" class="stage-button">Znovu</button>
  </div>
  <p id="timer-status" class="visually-hidden" role="status" aria-live="polite"></p>
</dialog>
